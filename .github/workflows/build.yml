name: Build Forge Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --stacktrace --no-daemon
      - name: Upload compiled JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackForge-Additional-World-Blocks
          path: build/libs/*.jar
          if-no-files-found: warn
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            build/tmp/compileJava/**
          if-no-files-found: ignore

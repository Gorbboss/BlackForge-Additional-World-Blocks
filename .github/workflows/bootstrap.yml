name: Import reconstructed source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify source archive
        shell: bash
        run: |
          test -f .bootstrap/READY
          cat .bootstrap/chunk-* > reconstructed-source.tar.gz
          echo "283e3fb211fbea3ba48a85c60774068d95dc9c02acfaf930449c0883e5eb2a02  reconstructed-source.tar.gz" | sha256sum -c -
          tar -xzf reconstructed-source.tar.gz
          rm reconstructed-source.tar.gz
      - name: Commit normal source tree
        shell: bash
        run: |
          git rm -r .bootstrap
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import reconstructed Even Better Nether 1.3.1 baseline"
          git push
